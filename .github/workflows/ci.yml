name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: fish_nearby_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fish_nearby_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fish_nearby_test
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fish_nearby_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Apply migrations, seed, and test PostGIS schema
        env:
          PGPASSWORD: postgres
        run: |
          psql "$DIRECT_DATABASE_URL" -f supabase/migrations/20260812000000_enable_postgis.sql
          psql "$DIRECT_DATABASE_URL" -f supabase/migrations/20260813000000_core_schema.sql
          psql "$DIRECT_DATABASE_URL" -f supabase/seed.sql
          psql "$DIRECT_DATABASE_URL" -f tests/integration/postgis.sql
          psql "$DIRECT_DATABASE_URL" -f tests/integration/core-schema.sql
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
